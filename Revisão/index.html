<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro dos Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <h1>🎮Cadastro dos Minigames</h1>
        <h2>Aqui o participante será cadastrado</h2>
        <form id="form-cadastro">
            <p><strong>Dados Pessoais</strong></p>
            <div>
                <label for="nome">Nome do Participante</label>
                <input type="text" id="nome" class="basico" placeholder="Digite seu nome" required>

            </div>
            <div class="row">
                <div class="idade">
                    <label for="idade">Idade do Participante</label>
                    <input type="number" id="idade" class="basico" placeholder="Digite sua idade" min="0" max="120"
                        required>
                </div>
                <div class="data">
                    <label for="data">Data de Nascimento</label>
                    <input type="date" name="data" id="data" class="basico" required>
                </div>
            </div>
            <div class="row">
                <div class="email">
                    <label for="email">Email do Participante</label>
                    <input type="email" name="email" id="email" class="basico" placeholder="seunome@email.com" required>
                </div>
                <div class="senha">
                    <label for="senha">Senha do Participante</label>
                    <input type="password" name="senha" id="senha" class="basico" placeholder="Digite sua Senha"
                        required>
                </div>
            </div>

            <hr>
            <p><strong>Preferências</strong></p>
            <p>Dificuldade</p>
            <input type="radio" name="dificuldade" id="facil" value="facil">
            <label for="facil">Fácil</label>
            <input type="radio" name="dificuldade" id="medio" value="medio">
            <label for="facil">Médio </label>
            <input type="radio" name="dificuldade" id="dificil" value="dificil">
            <label for="facil">Difícil</label>
            <p>Jogos Favoritos</p>
            <input type="checkbox" id="velha" value="velha">
            <label for="velha">Jogo da Velha</label>
            <input type="checkbox" id="sudoku" value="sudoku">
            <label for="sudoku">Sudoku</label>
            <input type="checkbox" id="mario" value="mario">
            <label for="mario">Mario Bros</label>
            <p>Personagem</p>
            <label for="personagem">Escolha seu personagem </label>

            <select id="personagem" class="selecao" required|>
                <option value="">Escolha seu Personagem</option>
                <option value="😊">😊</option>
                <option value="🤣">🤣</option>
                <option value="😒">😒</option>
            </select>
            
            <label for="mensagem">Mensagem para o Campeonato</label>

            <textarea id="mensagem" class="mensagem" placeholder="Digite sua Mensagem"></textarea>

            <button type="submit" class="cadastro">Cadastrar</button>
            <button type="reset" class="cadastro">Limpar Formulário</button>
        </form>
        <p id="mensagem"></p>
    </section>
    <script src="script.js"></script>
</body>

</html>
