<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section>
        <div>
            <p>
                Data de Nascimento : 
                <input class="data" type="number" name="txtdia" id="txtdia" min="1" max="31"> / 
                <input class="data" type="number" name="txtmes" id="txtmes" min="1" max="12"> /
                <input class="data" type="number" name="txtano" id="txtano">
            </p>
            <p>Sexo:
                <input type="radio" name="radsex" id="mas" checked>
                <label for="masc">Maculino</label>
                <input type="radio" name="radsex" id="fem">
                <label for="fem">Feminino</label>
            </p>
            <p>
                <input type="button" value="Verificar" onclick="verificar()">
            </p>
        </div>
        <div id="msg"></div>
        <div id="foto">
            <img id="imagem" src="" alt="">
        </div>
    </section>
    <footer>
        <p>&copy; Mtrluiz</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
