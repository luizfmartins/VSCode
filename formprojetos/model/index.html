<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="/formprojetos/view/index.css">
</head>

<body>
    <form action="/cadastro" method="post">
        <label for="nome"> Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
        <br><br>
        <label for="idade">Idade</label>
        <input type="number" id="idade" placeholder="Digite sua idade" min="1" required>
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
        <br><br>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
        <br><br>
        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento">
        <p>
            Escolha seu sexo:
        </p>
        <input type="radio" id="masc" name="sexo" value="masc">
        <label for="masc">Masculino</label>
        <input type="radio" id="fem" name="sexo" value="fem">
        <label for="masc">Feminino</label>
        <input type="radio" name="sexo" id="sla" value="sla">
        <label for="sla">Prefiro não responder</label>
        <br><br>
        <p>Quais jogos você gosta?</p>
        <input type="checkbox" id="velha" value="velha">
        <label for="velha">Jogo da Pursina</label>
        <input type="checkbox" id="sudoku" value="sudoku">
        <label for="sudoku">Sudoku do Jaiminho</label>
        <input type="checkbox" id="dama" value="dama">
        <label for="dama">A Dama de Vermelho</label>
        <br><br>
        <label for="personagem">Escolha seu personagem </label>
        <select id="personagem">
            <option value="">Escolha</option>
            <option value="Abrantina">👵</option>
            <option value="Josefino">👴</option>
            <option value="Gargalhada">😂</option>
        </select>
        <br><br>
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" rows="5" cols="30" placeholder="Digite sua Mensagem"></textarea>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <button type="button">Butão Comum</button>
        <br><br>
        <button>➡️</button>
    </form>
</body>

</html>
