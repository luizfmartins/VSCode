<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/formprojetos/view/index.css">
</head>
<body>
    <form action="">
        <label for="nome"> Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
        <br><br>
        <label for="apelido">Apelido</label>
        <input type="text" id="apelido" placeholder="Digite seu apelido">
        <br><br>
        <label for="idade">Idade</label>
        <input type="number" id="idade" placeholder="Digite sua idade" min="1" required>
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
        <br><br>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
        <br><br>
        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento">
        <br><br>
        <label for="personagem">Escolha seu personagem favorito</label>
        <select id="personagem">
            <option value="😊">😊</option>
            <option value="😂">😂</option>
            <option value="😍">😍</option>
            <option value="✌️">✌️</option>
            <option value="🎮">🎮</option>
            <option value="❣️">❣️</option>
        </select>
        <br><br>
        <p>
            Escolha a Dificuldade do Jogo:
        </p>
        <input type="radio" id="facil" name="dificuldade" value="facil">
        <label for="facil">Fácil</label>
        <input type="radio" id="medio" name="dificuldade" value="medio">
        <label for="medio">Médio</label>
        <input type="radio" id="dificil" name="dificuldade" value="dificil">
        <label for="dificil">Difícil</label>

        <p>Quais seus jogos favoritos?</p>
        <input type="checkbox" id="velha" value="velha">
        <label for="velha">👵Jogo da Vanilda</label>
        <input type="checkbox" id="sudoku" value="sudoku">
        <label for="sudoku">🧩Sudokudo Jaiminho</label>
        <input type="checkbox" id="dama" value="dama">
        <label for="dama">💃A Dama de Vermelho</label>
        <br><br>
        <label for="obs">Observações</label>
        <br>
        <textarea id="obs" rows="5" cols="30" placeholder="Campo de Observações"></textarea>
        <br>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
