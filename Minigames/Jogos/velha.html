<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Vanilda</title>
    <link rel="stylesheet" href="/Minigames/css/style.css">

</head>

<body>
    <header>
        <h1>👵 Jogo da Vanilda</h1>
    </header>
    <main>
        <p style="color: black;"><b>Escolher personagem do jogador 1:</b></p>
        <div class="escolherJogador1">
            <button onclick="escolherJogador1('💀')">💀</button>
            <button onclick="escolherJogador1('🍕')">🍕</button>
            <button onclick="escolherJogador1('👽')">👽</button>
        </div>
        <p id="jogador1-escolhido">Jogador 1: Nenhum</p>
        <p style="color: black;;"><b>Escolher personagem do jogador 2:</b></p>
        <div class="escolherJogador2">
            <button onclick="escolherJogador2('😎')">😎</button>
            <button onclick="escolherJogador2('😶')">😶</button>
            <button onclick="escolherJogador2('😍')">😍</button>
        </div>
        <p id="jogador2-escolhido">Jogador 2 : Nenhum</p>
        <div class="iniciarJogo">
            <button onclick="iniciarJogo()"><b>Iniciar Jogo</b></button>
        </div>
        <p id="jogador-atual" style="color: black;"><b>Jogador da vez:</b></p>
        <br>
        <section class="Velha">
            <table class="tabuleiro">
                <tr>
                    <td onclick="jogar(this)"></td>
                    <td onclick="jogar(this)"></td>
                    <td onclick="jogar(this)"></td>
                </tr>
                <tr>
                    <td onclick="jogar(this)"></td>
                    <td onclick="jogar(this)"></td>
                    <td onclick="jogar(this)"></td>
                </tr>
                <tr>
                    <td onclick="jogar(this)"></td>
                    <td onclick="jogar(this)"></td>
                    <td onclick="jogar(this)"></td>
                </tr>
            </table>
        </section>
        <br>
        <a href="/index.html">⬅️ Voltar para o início</a>
    </main>

    <footer>
        <p>MiniGames do Lipe</p>
    </footer>
    <script src="/Minigames/js/velha.js"></script>
</body>


</html>
