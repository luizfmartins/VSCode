<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: rgb(233, 218, 193);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 18px;
            padding: 32px;
            width: 800px;
            margin: auto;
        }

        div {
            border-color: black;
            border: 2px;
            border-radius: 5px;
            background-color: white;
            text-align: center;
            margin: auto;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>🎮Campeonato Mini Games</h1>
            <p>Inscrição de participantes</p>
        </div>
    </header>
    <section>
        <h1>Dados do participante</h1>
        <form>
            <label for="nome">Nome completo</label>
            <br>
            <input type="text" id="nome" placeholder="Digite seu nome" required>
        </form>
    </section>

</body>

</html>
