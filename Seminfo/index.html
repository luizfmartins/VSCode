<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminfo 3.0</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Seminfo 3.0</h1>
        <p>Sistema de Inscrições da Semana de Informática 2026</p>
        <a href="javascript:mostrarInscricao()">Inscrição</a>
        <a href="javascript:mostrarParticipantes()">Participantes</a>
    </header>
    <main>
        <section id="sec-inscricao">
            <h2>Inscrição de Participantes</h2>
            <h2>Nova Inscrição</h2>
            <form id="formulario">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="curso">Curso</label>
                <select id="curso" required>
                    <option value="" hidden></option>
                    <option value="Sistemas de Informação">Sistemas de Informação</option>
                    <option value="Gestão de TI">Gestão de TI</option>
                    <option value="Técnico de Informática">Técnico de Informática</option>
                    <option value="TADS">TADS</option>
                </select>
                <br><br>
                <button type="submit">Cadastrar</button>
            </form>
            <p id="mensagem"></p>
        </section>
        <section id="sec-participantes">
            <h2>Participantes Inscritos</h2>
            <p>Total: <span id="total">0</span></p>

            <dl id="participantes">
            </dl>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
