<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Seminfo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="admin" id="admin">
    <header>
        <h2>SEMINFO - ADMIN</h2>
        <nav>
            <a href="index.html">Início</a>
            <a href="participantes.html">Participantes</a>
            <a href="#" id="sair">Sair</a>
        </nav>
    </header>
    <main>
        <section class="card">
            <h1>Cadastrar Evento</h1>
            <form id="form-evento">
                <label>
                    Título:
                    <input type="text" name="titulo">
                </label>
                <label>
                    Categoria:
                    <select name="categoria">
                        <option value="" hidden></option>
                        <option value="MINICURSO">Minicurso</option>
                        <option value="OPCIONAL">Atividade Opcional</option>
                    </select>
                </label>
                <label>
                    Vagas:
                    <input type="number" name="vagas" min="1" value="30" required>
                </label>
                <button type="submit">
                    Adicionar Evento
                </button>
            </form>
            <p id="msg" class="msg"></p>
        </section>
        <section class="card">
            <h2>
                Eventos Cadastrados
            </h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Evento</th>
                            <th>Categoria</th>
                            <th>Vagas</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-eventos">

                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
