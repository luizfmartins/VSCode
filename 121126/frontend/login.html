<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Seminfo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="login" id="login">
    <header>
        <h2>SEMINFO</h2>
        <nav><a href="cadastro.html">Criar Conta</a></nav>
    </header>
    <main>
        <section class="card narrow">
            <h1 style="font-size: 40px;">Logar no Sistema Seminfo</h2>
            <form id="form-login">
                <label>Email:<input type="email" name="email" required></label>
                
                <label>Senha:<input type="password" name="senha"> </label>
                
                <button type="submit">Entrar</button>
            </form>
            <p id="mensagem" class="mensagem"></p>
            <p>Não Possui conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
