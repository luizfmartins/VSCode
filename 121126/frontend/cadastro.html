<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Seminfo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="cadastro" id="cadastro">
    <header>
        <h1>SEMINFO</h1>
        <nav>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <section class="card-narrow">
            <h1 style="font-size: 40px;">Criar Conta</h2>
                <form id="form-cadastro">
                    <label>
                        Nome:
                        <input type="text" name="nome" required>
                    </label>
                    <label>
                        Idade:
                        <input type="number" name="idade" min="1" max="120" required>
                    </label>
                    <label>
                        Email:
                        <input type="email" name="email" required>
                    </label>
                    <label>
                        Senha:
                        <input type="password" name="senha">
                    </label>
                    <label>
                        Perfil:
                        <select name="perfil" id="perfil" required>
                            <option value="" hidden></option>
                            <option value="Aluno">ALUNO(Ouvinte)</option>
                            <option value="Professor">PROFESSOR(Administrador)</option>
                            <option value="Externo">EXTERNO(Ouvinte ou Apresentador)</option>
                        </select>
                    </label>
                    <div id="campos-aluno">
                        <label>
                            Matrícula:
                            <input type="text" name="matricula">
                        </label>
                        <label>
                            Curso:
                            <input type="text" name="curso">
                        </label>
                    </div>
                    <div id="campos-instituicao" class="hidden">
                        <label>
                            Instituição:
                            <input type="text" name="instituicao">
                        </label>
                    </div>
                    <button type="submit">Cadastrar</button>
                </form>
                <p id="mensagem" class="mensagem"></p>
                <a href="login.html"> Voltar ao Login</a></p>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
