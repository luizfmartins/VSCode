<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Inscrição - Seminfo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="inicio" id="inicio">
    <header>
        <h1>SEMINFO - SEMANA DE INFORMÁTICA</h1>
        <nav>
            <a href="index.html">Minha Inscrição</a>
            <a href="admin.html" id="link-admin" class="hidden">Eventos (Admin)</a>
            <a href="participantes.html" id="link-participantes" class="hidden">Participantes</a>
            <a href="#" id="sair">Sair</a>
        </nav>
    </header>
    <main>
        <section class="card">
            <h1>Inscrição - Seminfo</h1>
            <p>
                Bem-vindo à Semana de Informática!
                Confira seus dados e escolha a atividade da qual deseja participar.
            </p>
        </section>
        <section class="card">
            <h2>Dados do Participante</h2>
            <h3>Olá, <span id="nome-usuario"></span>!</h3>
            <p id="perfil-usuario" class="muted"></p>
            <div id="dados-participante">
                
            </div>
        </section>
        <section class="card">
            <h2>Inscrição nas Atividades</h2>
            <div id="inscricao-atual"></div>
            <form id="form-inscricao" class="hidden">
                <label>
                    Escolha o Evento:
                    <select name="evento-id" id="evento-select" required>

                    </select>
                </label>
                <label>
                    Modalidade:
                    <select name="modalidade" id="modalidade-select" required></select>
                </label>
                <button type="submit">Confirmar Inscrição</button>
            </form>
            <p id="msg" class="msg"></p>
        </section>
        <section class="card">
            
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
